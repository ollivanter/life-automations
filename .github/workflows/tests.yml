name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - run: pip install -r requirements.txt
      - name: German vocab bot
        working-directory: german-vocab-bot
        run: python -m unittest -v
      - name: Notion study tracker
        working-directory: notion-study-tracker
        run: python -m unittest -v
      - name: Deadline catcher
        working-directory: deadline-catcher
        env:
          TZ: Asia/Kolkata
        run: node test.js
