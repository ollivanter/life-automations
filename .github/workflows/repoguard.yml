name: RepoGuard

# Security audit on every push and pull request: leaked secrets (including git
# history), vulnerable dependencies and risky workflow configuration.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ollivanter/repoguard@fd117a1fadfe1eb8480698ad45f2e579c8fc2c1e # main
        with:
          fail-on: high
